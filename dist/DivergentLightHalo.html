ap:8px;min-height:30px;padding:2px 6px;border-radius:7px;cursor:pointer}.lrow:hover{background:var(--sunk)}.lrow.off .lname{color:var(--ink-3)}.lrow input[type=checkbox]{width:15px;height:15px;margin:0;accent-color:var(--accent);flex:none}.lsw{width:22px;height:12px;flex:none;position:relative}.lsw:before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--w, 2.5px);transform:translateY(-50%);border-radius:2px;background:var(--c)}.lsw.dash:before{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 8px)}.lsw.dots:before{height:8px;background:radial-gradient(circle,var(--c) 1.6px,transparent 2px) 0 0 / 5px 8px}.lsw.fill:before{height:12px;border-radius:3px;background:linear-gradient(90deg,#440154,#31688e,#35b779,#fde725);opacity:.8}.lsw.none:before{display:none}.lname{flex:1;min-width:0;font-size:12.5px}.lcount{font:11px var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}.lrow .qmark{width:16px;height:16px;font-size:10px}.lsub{margin-left:22px}.color-mode{display:flex;align-items:center;gap:6px;margin:2px 0 6px 29px}.color-mode select{height:26px;font-size:12px;flex:1}.probe{padding:4px 0 14px;display:flex;flex-direction:column;gap:9px}.probe+.probe{border-top:1px solid var(--line);padding-top:14px}.probe-head{display:flex;align-items:center;gap:8px}.probe-head b{font-weight:600}.probe-body{display:flex;flex-direction:column;gap:9px}.probe-body.off{display:none}.probe-status{font-size:11.5px;color:var(--ink-2);line-height:1.55;white-space:pre-line;background:var(--sunk);border-radius:8px;padding:6px 8px}.probe-status:empty{display:none}.switch.mini{gap:6px;font-size:12px;margin-left:auto}.switch.mini .sw{width:26px;height:15px}.switch.mini .sw:after{width:11px;height:11px}.switch.mini input:checked+.sw:after{transform:translate(11px)}.results{display:flex;flex-direction:column;gap:10px;font-size:12px}.rpath{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}.rpath header{display:flex;align-items:center;gap:7px;font-weight:600}.rpath header code{font:700 12.5px var(--mono)}.rpath header .rt{margin-left:auto;font:11px var(--mono);color:var(--ink-3);font-weight:400}.rpath dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;color:var(--ink-2)}.rpath dt{color:var(--ink-3)}.rpath dd{margin:0;font-variant-numeric:tabular-nums}.rnote{color:#8a5a00;background:#fff7e6;border:1px solid #f5d9a6;border-radius:8px;padding:6px 8px;line-height:1.55;margin-top:7px}.rnote.err{color:#9b1c1c;background:#fdecec;border-color:#f3b4b4}.rintro{color:var(--ink-2);line-height:1.6}.tip{position:fixed;z-index:50;max-width:340px;padding:10px 12px;border-radius:10px;background:var(--tip-bg);color:var(--tip-ink);font-size:12.5px;line-height:1.6;box-shadow:var(--shadow-pop)}.tip b{display:block;margin-bottom:3px;font-size:13px}.tip p{margin:0 0 5px}.tip p:last-child{margin:0}.glossary{width:min(780px,calc(100vw - 32px));max-height:min(84vh,900px);padding:0;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop)}.glossary::backdrop{background:#14192352}.glossary header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}.glossary h2{font-size:15px}.gl-body{padding:8px 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:4px 22px}.gl-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.65;color:var(--ink-2)}.gl-item b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}.gl-item p{margin:0 0 4px}@media (max-width: 1400px) and (min-width: 901px){.app{grid-template-columns:280px minmax(0,1fr) 290px}.app.no-read{grid-template-columns:280px minmax(0,1fr) 0}.setup{padding:0 14px 24px}.read{padding:10px 12px 20px}}@media (max-width: 900px){.app,.app.no-read{grid-template-columns:1fr;grid-template-rows:48px 40px minmax(0,1fr);grid-template-areas:"bar" "tabs" "main"}.tabs{grid-area:tabs;display:flex;gap:4px;padding:4px 8px;background:var(--card);border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;border-radius:8px;background:none;color:var(--ink-2)}.tabs button.on{background:var(--accent-weak);color:var(--accent-text);font-weight:600}.setup,.stage,.read{grid-area:main;display:none!important}.app[data-tab=setup] .setup{display:block!important}.app[data-tab=stage] .stage{display:flex!important}.app[data-tab=read] .read{display:flex!important;position:static;width:auto;box-shadow:none;border:0}.crumbs,.hide-sm{display:none}.status{padding:0 9px}.status span{display:none}.bar{gap:6px;padding-left:10px;padding-right:10px}.bar .btn{padding:0 9px}.stage{padding:8px}.tabs button{padding:0 4px;white-space:nowrap}.stage-bar{position:absolute;right:18px;bottom:18px;z-index:5;min-height:0;pointer-events:none}.stage-bar .view-switch,.stage-bar .panel-toggle,.stage-bar .grow{display:none}.colorbar{padding:4px 8px;border-radius:8px;background:var(--glass);border:1px solid var(--glass-line)}.colorbar canvas{width:80px}.gl-body{grid-template-columns:1fr}}@media (max-width: 520px){.brand strong{font-size:13.5px}.pane-head>b,.pane-head>.qmark-lite{display:none}.pane-head{gap:4px;padding:4px 6px}.pane-head .seg button{padding:0 6px}.cb-lab{display:none}}
</style>
</head>
<body>
<div class="app" id="app" data-tab="stage">

  <!-- ================= 顶栏 ================= -->
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <path d="M16 7.5L26.5 27H5.5z" class="lg-cone"/>
        <path d="M11 22.5a8 4 0 0 0 10 0" class="lg-ring"/>
        <circle cx="16" cy="7" r="3.4" class="lg-sun"/>
      </svg>
      <strong data-i18n="app.title">发散光晕 3D</strong>
    </div>
    <div class="crumbs" id="crumbs" aria-live="polite"></div>
    <div class="grow"></div>
    <div class="status" id="status"><i></i><span id="statusText">…</span></div>
    <div class="seg mini lang-seg" id="langSeg" role="radiogroup" aria-label="Language">
      <button role="radio" data-lang="zh">中</button>
      <button role="radio" data-lang="en">EN</button>
    </div>
    <button class="icon-btn" id="btnGlossary" data-i18n-title="bar.glossaryTitle">
      <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M4 3.5h8.5a3 3 0 013 3V16.5H7a3 3 0 01-3-3z M4 13.5a3 3 0 013-3h8.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </button>
    <div class="menu-wrap">
      <button class="btn" id="btnExport" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3v9m0 0l-3.5-3.5M10 12l3.5-3.5M4 14v2.5h12V14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="hide-sm" data-i18n="bar.export">导出</span>
      </button>
      <div class="menu" id="exportMenu" hidden>
        <button id="btnPng"><b data-i18n="bar.png">图片 (PNG)</b><small data-i18n="bar.pngTitle">当前视图连同标题</small></button>
        <button id="btnCsv"><b data-i18n="bar.csv">数据 (CSV)</b><small data-i18n="bar.csvTitle">晕面点、边界、焦散、球壳曲线</small></button>
      </div>
    </div>
  </header>

  <!-- 窄屏: 设置 / 视图 / 显示 切换 -->
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="setup"><span data-i18n="tab.setup">设置</span></button>
    <button role="tab" data-tab="stage" data-v="3d"><span data-i18n="view.3d">3D 场景</span></button>
    <button role="tab" data-tab="stage" data-v="sky" class="on"><span data-i18n="tab.sky">天空</span></button>
    <button role="tab" data-tab="read"><span data-i18n="tab.read">显示</span></button>
  </nav>

  <!-- ================= 左: 按步骤设定 ================= -->
  <aside class="setup panel" id="setup">

    <section class="step">
      <header class="step-head">
        <span class="step-num">1</span>
        <h2 data-i18n="s1.title">灯与眼</h2>
        <button class="qmark" data-term="scene" aria-label="?">?</button>
      </header>
      <div class="scene-fig"><svg id="sceneFig" viewBox="0 0 300 84" aria-hidden="true"></svg></div>
      <div class="slider-row">
        <label for="slElev" class="lbl" data-i18n="s1.elev">灯仰角 Σ</label>
        <input type="range" id="slElev" min="-90" max="90" step="0.5">
        <span class="numbox"><input type="number" id="inElev" min="-90" max="90" step="0.5"><i>°</i></span>
      </div>
      <div class="slider-row">
        <label for="slDist" class="lbl" data-i18n="s1.dist">灯距 D</label>
        <input type="range" id="slDist" min="0" max="1000" step="1">
        <span class="numbox"><input type="number" id="inDist" min="1" max="300" step="1"><i>m</i></span>
      </div>
      <div class="slider-row">
        <label for="slEye" class="lbl" data-i18n="s1.eye">眼高</label>
        <input type="range" id="slEye" min="0" max="5" step="0.1">
        <span class="numbox"><input type="number" id="inEye" min="0" max="5" step="0.1"><i>m</i></span>
      </div>
    </section>

    <section class="step">
      <header class="step-head">
        <span class="step-num">2</span>
        <h2 data-i18n="s2.title">光路</h2>
        <button class="qmark" data-term="path" aria-label="?">?</button>
        <div class="menu-wrap presets-wrap">
          <button class="btn small" id="btnPresets" aria-haspopup="true" aria-expanded="false"><span data-i18n="s2.presets">常见晕弧</span>
            <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <div class="menu presets-pop" id="presetsPop" hidden></div>
        </div>
      </header>
      <input id="inPath" class="path-input" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="s2.ph" placeholder="3-5; 3-1-5">
      <div class="chain" id="chain"></div>
      <div class="msg" id="pathMsg"></div>
      <details class="crystal-det" id="crystalDet">
        <summary><span data-i18n="crystal.pick">在晶体上点选面</span></summary>
        <div class="crystal-box">
          <canvas id="cvCrystal"></canvas>
          <div class="crystal-tools">
            <div class="seg mini" id="crySeg" role="radiogroup">
              <button role="radio" data-cry="0" data-i18n="crystal.prism">棱柱</button>
              <button role="radio" data-cry="1" data-i18n="crystal.pyramid">锥晶</button>
            </div>
            <div class="role-key" data-i18n="crystal.roles"></div>
            <div class="crystal-btns">
              <button class="btn small" id="btnBack" data-i18n="crystal.back">退一格</button>
              <button class="btn small" id="btnNewPath" data-i18n="crystal.newPath">+ 一条</button>
              <button class="btn small" id="btnClear" data-i18n="crystal.clear">清空</button>
            </div>
          </div>
        </div>
        <p class="note" data-i18n="faces.hint">底面 1 / 2 · 柱面 3–8 · 上锥 13–18 · 下锥 23–28</p>
      </details>
    </section>

    <section class="step">
      <header class="step-head">
        <span class="step-num">3</span>
        <h2 data-i18n="s3.title">晶体取向</h2>
        <button class="qmark" data-term="orientation" aria-label="?">?</button>
      </header>
      <div class="modes" id="modes" role="radiogroup">
        <button role="radio" data-mode="plate"><b data-i18n="mode.plate">板晶</b><small>1</small></button>
        <button role="radio" data-mode="parry"><b>Parry</b><small>1</small></button>
        <button role="radio" data-mode="custom"><b data-i18n="mode.custom">自定义</b><small>1</small></button>
        <button role="radio" data-mode="column"><b data-i18n="mode.column">柱晶</b><small>2</small></button>
        <button role="radio" data-mode="lowitz"><b>Lowitz</b><small>2</small></button>
      </div>
      <p class="mode-desc" id="modeDesc"></p>
      <div class="slider-row" id="rowZeta">
        <label for="slZeta" class="lbl" id="lbZeta">ζ</label>
        <input type="range" id="slZeta" min="-180" max="180" step="1">
        <span class="numbox"><input type="number" id="inZeta" min="-180" max="180" step="1"><i>°</i></span>
      </div>
      <div class="slider-row" id="rowTheta">
        <label for="slTheta" class="lbl" id="lbTheta">θ</label>
        <input type="range" id="slTheta" min="-180" max="180" step="1">
        <span class="numbox"><input type="number" id="inTheta" min="-180" max="180" step="1"><i>°</i></span>
      </div>
      <div class="field-col" id="rowSurf">
        <div class="field-lab"><span data-i18n="s3.surf">二自由度曲面</span><button class="qmark" data-term="surf2" aria-label="?">?</button></div>
        <select id="selSurf"></select>
      </div>
    </section>

    <details class="more" id="more">
      <summary><span data-i18n="more.title">更多选项</span> <span class="more-tags" id="moreTags"></span></summary>
      <div class="more-body">
        <div class="field-row">
          <span class="lbl" data-i18n="more.quality">精度</span>
          <div class="seg mini" id="qSeg" role="radiogroup">
            <button role="radio" data-q="0" data-i18n="more.qLow">低</button>
            <button role="radio" data-q="1" data-i18n="more.qMid">中</button>
            <button role="radio" data-q="2" data-i18n="more.qHigh">高</button>
          </div>
        </div>
        <div class="field-row">
          <label for="inMaxD" class="lbl" data-i18n="more.maxDist">截断距离</label>
          <span class="numbox"><input type="number" id="inMaxD" min="5" max="500" step="5"><i>m</i></span>
          <button class="qmark" data-term="maxDist" aria-label="?">?</button>
        </div>
        <div class="field-row">
          <label for="inN" class="lbl" data-i18n="more.n">折射率 n</label>
          <span class="numbox"><input type="number" id="inN" min="1.01" max="2" step="0.001"></span>
          <button class="link" id="btnNReset" data-i18n="more.nReset">恢复 1.31</button>
        </div>
        <div class="field-row">
          <label for="inApexUp" class="lbl" data-i18n="more.apexUp">上锥顶角</label>
          <span class="numbox"><input type="number" id="inApexUp" min="2" max="178" step="0.5"><i>°</i></span>
          <span class="miller" id="millerUp"></span>
        </div>
        <div class="field-row">
          <label for="inApexLo" class="lbl" data-i18n="more.apexLo">下锥顶角</label>
          <span class="numbox"><input type="number" id="inApexLo" min="2" max="178" step="0.5"><i>°</i></span>
          <span class="miller" id="millerLo"></span>
        </div>
        <p class="note" data-i18n="more.method"></p>
      </div>
    </details>
  </aside>

  <!-- ================= 中: 视图 ================= -->
  <main class="stage" id="stage">
    <div class="stage-bar">
      <div class="seg view-switch" id="viewSeg" role="radiogroup">
        <button role="radio" data-view="split" data-i18n="view.split">并排</button>
        <button role="radio" data-view="3d" data-i18n="view.3d">3D 场景</button>
        <button role="radio" data-view="sky" data-i18n="view.sky">观测者天空</button>
      </div>
      <div class="grow"></div>
      <div class="colorbar" id="colorbar" hidden><span class="cb-lab" id="cbLab"></span><span class="cb-min" id="cbMin"></span><canvas id="cvBar" width="120" height="8"></canvas><span class="cb-max" id="cbMax"></span></div>
      <button class="btn small panel-toggle" id="btnPanel" aria-pressed="true">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12.5 4v12" stroke="currentColor" stroke-width="1.5"/></svg>
        <span data-i18n="bar.panel">显示设置</span>
      </button>
    </div>
    <div class="views" id="views">
      <section class="pane pane3d" id="pane3d">
        <header class="pane-head">
          <b data-i18n="view.3dTitle">三维晕面</b>
          <span class="qmark-lite" data-i18n-title="view.3dHint" title="">?</span>
          <div class="grow"></div>
          <div class="seg mini cam-seg">
            <button data-cam="oblique" data-i18n="cam.oblique">斜看</button>
            <button data-cam="side" data-i18n="cam.side">侧面</button>
            <button data-cam="top" data-i18n="cam.top">俯视</button>
            <button data-cam="eye" data-i18n="cam.eye">从眼睛</button>
          </div>
        </header>
        <div class="pane-body">
          <div class="host3d" id="host3d"><div class="labels3d"></div></div>
          <div class="empty-note" id="note3d" hidden></div>
          <div class="progress" id="prog3d"></div>
        </div>
      </section>
      <section class="pane panesky" id="paneSky">
        <header class="pane-head">
          <b data-i18n="view.skyTitle">观测者看到的天空</b>
          <span class="qmark-lite" data-i18n-title="view.skyHint" title="">?</span>
          <div class="grow"></div>

entry / mirror / exit"],"res.bdryKinds2":["掠入 / 出射 / 接缝 / 转折 / 尖点","entry / exit / seam / turn / cusp"],"res.surf":["曲面","surface"],"res.surfFallback":["这条光路没有选中的曲线, 已改用焦散","this path has no such curve; using the caustic"],"res.caustic":["焦散段","caustic arcs"],"res.seams":["边界像","images"],"res.shell":["球壳","shell"],"res.shellLine":["{a} 弧 · {e} 末端 · {f} 折叠","{a} arcs · {e} ends · {f} folds"],"res.dof1":["一自由度","1 DOF"],"res.dof2":["二自由度","2 DOF"],"res.nothing":["这个取向下光路走不通, 或者晶体都在截断距离外 / 灯后方: 没有晕.","The path does not work for this orientation, or every crystal is beyond the truncation or behind the lamp: no halo."],"st.err":["出错: {e}","Error: {e}"],"st.noPath":["没有光路","no path"],"st.main":["计算晕面 {d}/{n}","computing surface {d}/{n}"],"st.dense":["加密 h 层 {d}/{n}","densifying h layers {d}/{n}"],"st.obs":["计算焦散…","computing caustic…"],"st.shell":["计算球壳…","computing shell…"],"st.cone":["计算锥切片…","computing cone slice…"],"st.done":["完成 · {ms} ms","done · {ms} ms"],"gl.title":["术语","Glossary"],"pre.sundog":["路灯幻日","Lamp sundogs"],"pre.sundog.d":["板晶 · 灯仰角 10°","plates · lamp at 10°"],"pre.cza":["环天顶弧","Circumzenithal arc"],"pre.cza.d":["板晶 · 灯仰角 25°","plates · lamp at 25°"],"pre.cha":["环地平弧","Circumhorizontal arc"],"pre.cha.d":["板晶 · 灯仰角 60°","plates · lamp at 60°"],"pre.parry":["Parry 弧","Parry arcs"],"pre.parry.d":["Parry 取向 · 灯仰角 15°","Parry orientation · lamp at 15°"],"pre.tangent":["上/下切弧","Tangent arcs"],"pre.tangent.d":["柱晶 · 灯仰角 15°","columns · lamp at 15°"],"pre.circumscribed":["外接晕","Circumscribed halo"],"pre.circumscribed.d":["柱晶 · 灯仰角 40°","columns · lamp at 40°"],"pre.supralateral":["上侧弧","Supralateral arc"],"pre.supralateral.d":["柱晶 · 灯仰角 20°","columns · lamp at 20°"],"pre.infralateral":["下侧弧","Infralateral arcs"],"pre.infralateral.d":["柱晶 · 灯仰角 20°","columns · lamp at 20°"],"pre.wegener":["Wegener 反日弧","Wegener anthelic arc"],"pre.wegener.d":["柱晶 · 灯仰角 10° · 看背灯方向","columns · lamp at 10° · look away from the lamp"],"pre.lowitz":["Lowitz 弧","Lowitz arcs"],"pre.lowitz.d":["Lowitz 取向 · 灯仰角 20°","Lowitz orientation · lamp at 20°"],"pre.tape":["Tape 弧","Tape arcs"],"pre.tape.d":["Parry 取向 · 灯仰角 15°","Parry orientation · lamp at 15°"],"pre.hastings":["Hastings 弧","Hastings arc"],"pre.hastings.d":["Parry 取向 · 灯仰角 10°","Parry orientation · lamp at 10°"]};var nl={scene:{zh:["灯与眼 (发散光)",'<p>太阳在无穷远, 所有冰晶看到的太阳都在同一个方向. 路灯不是: 每个晶体看到的"太阳"(灯) 方向随它所在的位置变. 所以路灯下的晕不是天上的一条弧, 而是空间里的一张<b>晕面</b>.</p><p>灯在眼睛正前方 (方位 0°), 仰角 Σ、距离 D; 眼高是眼睛离地面的高度. 坐标: Z 朝上, 灯 L = (D cosΣ, 0, D sinΣ), 眼 E = (0, 0, 眼高).</p>'],en:["Lamp and eye (divergent light)",'<p>The Sun is infinitely far away, so every ice crystal sees it in the same direction. A street lamp is not: the direction in which a crystal sees the "sun" (the lamp) depends on where the crystal is. So a lamp halo is not an arc in the sky but a <b>halo surface</b> in space.</p><p>The lamp is straight ahead of the eye (azimuth 0°) at elevation Σ and distance D; eye height is the eye above the ground. Coordinates: Z up, lamp L = (D cosΣ, 0, D sinΣ), eye E = (0, 0, eye height).</p>']},path:{zh:["光路","<p>光在冰晶里依次经过哪些面: 第一个面是入射面, 最后一个是出射面, 中间的是内部反射面. 例: 3-5 = 从柱面 3 进、柱面 5 出 (22° 晕、幻日、切弧都是它).</p><p>面号: 底面 1 (顶) / 2 (底); 柱面 3–8 逆时针每 60°; 锥面 13–18 / 23–28 在柱面之上 / 之下. 多条光路用 ; 隔开, 一起画.</p>"],en:["Ray path","<p>The faces the light meets inside the crystal, in order: the first is the entry face, the last the exit face, the ones between are internal reflections. Example: 3-5 = in through prism face 3, out through prism face 5 (the 22° halo, sundogs and tangent arcs all use it).</p><p>Faces: basal 1 (top) / 2 (bottom); prism faces 3–8 every 60° counter-clockwise; pyramid faces 13–18 / 23–28 above / below the prism faces. Separate several paths with ;.</p>"]},orientation:{zh:["晶体取向与自由度",'<p>冰晶在空中怎么摆. 一个自由度 = 只能绕竖直轴转 (板晶、Parry、自定义 ζ θ): 晕面是一张曲面. 两个自由度 = 还能再转一个角 (柱晶、Lowitz): 能到达的位置是一块"体", 画的是它的焦散或选定的一条边界曲面.</p><p>R(α, ζ, θ) = Rz(α)·Ry(ζ)·Rz(θ): α 方位, ζ c 轴天顶角, θ 绕 c 轴自旋.</p>'],en:["Orientation and degrees of freedom","<p>How the crystal is held in the air. One degree of freedom = it can only turn about the vertical (plate, Parry, custom ζ θ): the halo surface is a surface. Two degrees of freedom = one more angle is free (column, Lowitz): the reachable positions fill a volume, and what is drawn is its caustic or a chosen boundary surface.</p><p>R(α, ζ, θ) = Rz(α)·Ry(ζ)·Rz(θ): α azimuth, ζ zenith angle of the c-axis, θ spin about the c-axis.</p>"]},surface:{zh:["晕面 · 光锥法","<p>空间里所有能把灯光按这条光路送进眼睛的晶体位置. 观测者看到的晕 = 从眼睛看出去这张曲面的样子 (天空视图).</p><p><b>光锥法</b>: 按灯处入射仰角 h 一层层 (每层是以灯为顶点的圆锥), 在锥上闭式解出方位 ψ 和晶体位置 P = L + t·û.</p><p><b>网格</b> (一自由度): 在 (h, 晶体方位 α) 参数平面上铺网格, 每个格点闭式定位; 跨出有效区的三角形沿精确判据二分到零 (入射掠射 / 镜面掠射 / 出射临界 / ψ 转折 / 捏合 / 截断), 所以曲面的边恰好落在边界线上. 二自由度时每个 h 层画成一条线; 第一轮算完后在有曲线的 h 区间里再补层, 线够密才看得出曲面.</p><p>着色: <b>h</b> = 晶体看到灯的仰角; <b>ρ = r/D</b> = 晶体离眼的距离 ÷ 灯距 (发散度, ρ→0 就是平行光).</p>"],en:["Halo surface · light-cone method","<p>Every crystal position that sends lamp light along this path into the eye. What the observer sees = this surface as seen from the eye (the sky view).</p><p><b>Light-cone method</b>: layer by layer in the incidence elevation h at the lamp (each layer is a cone with its apex at the lamp), solve the azimuth ψ and the position P = L + t·û on the cone in closed form.</p><p><b>Mesh</b> (one degree of freedom): a grid on the (h, crystal azimuth α) parameter plane, every node placed exactly; triangles that leave the valid region are bisected to the exact criterion (entry grazing / mirror grazing / exit critical / ψ turn / pinch / truncation), so the edge of the surface lies on the boundary lines. With two degrees of freedom each h layer is drawn as a line; after the first pass more layers are added where curves exist, so the lines are dense enough to show the surface.</p><p>Colours: <b>h</b> = elevation at which the crystal sees the lamp; <b>ρ = r/D</b> = crystal-to-eye distance ÷ lamp distance (divergency; ρ→0 is parallel light).</p>"]},pts:{zh:["光锥采样点 (原窗体)","<p>原窗体画的点: 光锥法在均匀的 (h, α) 网格与 (α, ψ) 网格上闭式求出的晶体位置, 每个点都精确, 但分布不均 — 靠近出射临界边界时位置随 h 变化极快 (平方根型), 均匀取样在那里会留下大片空白, 所以点离边界线有一段距离. 晕面网格没有这个问题.</p>"],en:["Light-cone samples (original)","<p>The points the original window drew: crystal positions solved in closed form on uniform (h, α) and (α, ψ) grids. Each point is exact, but they are unevenly spread: near the exit-critical boundary the position changes very fast with h (square-root behaviour), so uniform sampling leaves wide gaps and the points stop short of the boundary lines. The surface mesh does not have this problem.</p>"]},bEntry:{zh:["入射掠射边界","<p>光正好擦着入射面进晶体 (入射角 90°). 再往外光就进不去了, 晕面在这里终止.</p><p>一维闭式: 入射方向躺在入射面切平面的单位圆上, 沿圆参数 τ 走一圈, 每点闭式定位; 角点 / 转折 / 捏合处二分到机器精度.</p>"],en:["Entry-grazing boundary","<p>The light just skims the entry face (incidence 90°). Beyond it the light cannot get in, so the surface ends here.</p><p>Closed form in one parameter: the incident direction lies on the unit circle in the entry face’s tangent plane; walk the circle (τ), place each point exactly, and bisect corners / turns / pinches to machine precision.</p>"]},bMirror:{zh:["镜面掠射边界","<p>光在某个内部反射面上正好擦过 (到不了那个面). 只有带内部反射的光路才有. 一维闭式构造同入射掠射.</p>"],en:["Mirror-grazing boundary","<p>Inside the crystal the light just skims one of the reflecting faces (it stops reaching that face). Only paths with internal reflections have it. Same one-parameter closed form as entry grazing.</p>"]},bTir:{zh:["出射临界边界",'<p>光到出射面时正好处在全反射临界角: 再斜一点就出不去 (全反射). 二自由度时也包括"蓝边" (部分反射的台阶).</p>'],en:["Exit-critical boundary","<p>At the exit face the light is exactly at the critical angle: a little more oblique and it is totally reflected and cannot leave. With two degrees of freedom this bucket also holds blue edges (partial-reflection steps).</p>"]},bSeam:{zh:["接缝 (二自由度)","<p>内部反射面上光的法向冲量正好为零 (q = 0) 的那条线, 晕面在这里与相邻光路接上. 由平行光末端点的身份沿 h 延拓得到.</p>"],en:["Seam (two degrees of freedom)","<p>Where the light’s normal momentum on an internal reflecting face is exactly zero (q = 0); the surface joins the neighbouring path there. Obtained by continuing parallel-light endpoints along h.</p>"]},bTurn:{zh:["转折缝 (二自由度)",'<p>焦散曲面碰到"可达带"的边 (晶体姿态在这里转不过去) 留下的线: 平行光焦散的转折点随 h 走出来的轨迹.</p>'],en:["Turn seam (two degrees of freedom)","<p>Where the caustic surface meets the edge of the reachable band (the orientation cannot turn further): the track of the parallel-light caustic’s turning points as h changes.</p>"]},bCusp:{zh:["尖点脊线 (二自由度)","<p>平行光焦散在天上的尖点 (折叠的折叠) 随 h 走出来的轨迹, 是焦散曲面自身的一条棱.</p>"],en:["Cusp ridge (two degrees of freedom)","<p>The track of the parallel-light caustic’s cusps (a fold of the fold) as h changes; an edge of the caustic surface itself.</p>"]},bRim:{zh:["晕面外缘 (二自由度)","<p>把相邻光锥层的层曲线端点连成的线, 也就是画出来的晕面实际的边. 上面几种边界线来自平行光曲线的末端点 (碰到别的边界、转折、尖点) 随 h 的延拓, 但晕面还会在别处收口: 有的末端点映到灯后或眼后 (看不见), 有的曲线挨着光路走不通的区域结束. 这条线把这些都包括在内; 与精确边界重合的地方被精确边界盖住.</p><p>焦散面 (亮缘) 的外缘是精确算的: 外缘点 = 焦散与有效区边 (最紧的那个光路约束刚好用尽) 的交点, 沿 h 用 Newton 一步步延拓, 再映到光锥上; 选的是某条边界面时, 由各层层曲线的精确端点连成.</p>"],en:["Surface rim (two degrees of freedom)","<p>The actual edge of the drawn surface. For the caustic (bright-rim) surface it is computed exactly: a rim point is where the caustic meets the edge of the valid region (the tightest ray-path condition just used up), continued along h with Newton steps and mapped onto the light cone. For a chosen boundary surface it joins the exact end points of the layer curves on neighbouring layers. The boundary lines above come from continuing the parallel-light curve’s end points (meeting another boundary, turning, cusps) along h, but the surface can also close off elsewhere: some end points map behind the lamp or behind the eye (invisible), and some curves stop next to orientations where the ray path fails. This line covers all of them; where it coincides with an exact boundary, the exact one is drawn on top.</p>"]},caustic:{zh:["发散焦散 (观测者)","<p>观测者天上最亮的那些线: 很多晶体的光挤到同一个方向. 在空间里它是晕面从眼睛看过去的<b>轮廓</b> (曲面在这里转过身).</p><p>直接解, 不经过点云: 先追一条与灯无关的普适曲线 χ(ξ) = 0, 再用锥上闭式配对方位角并裁掉看不见的部分. 实线 = 有界段, 虚线 = 一直延伸到截断距离的段. 若没有, 结果里会说明原因 (真的没有 / 在灯后方 / 在眼后方 …).</p>"],en:["Divergent caustic (observer)","<p>The brightest lines in the observer’s sky, where light from many crystals piles up in one direction. In space it is the <b>outline</b> of the halo surface as seen from the eye (where the surface turns away).</p><p>Solved directly, not from the cloud: trace a lamp-independent universal curve χ(ξ) = 0, then pair the azimuth on the cone in closed form and cut what cannot be seen. Solid = bounded part, dashed = parts running out to the truncation distance. If there is none, the results panel says why (really none / behind the lamp / behind the eye …).</p>"]},cSeam:{zh:["边界的天空像","<p>掠射 / 全反射边界在观测者天上的样子 (K5 缝像): 亮度在这里突然变化.</p>"],en:["Sky images of boundaries","<p>The grazing / total-reflection boundaries as they appear in the observer’s sky (K5 seam images): the brightness steps there.</p>"]},cAsym:{zh:["渐近圆",'<p>晕面延伸到无穷远时, 在天上趋近的圆 (逆反射方向, K4). 只有"无界"的晕面才有: 它的平行光弧经过反灯点.</p>'],en:["Asymptotic circles","<p>The circles in the sky that the halo surface approaches as it runs off to infinity (retro-reflection directions, K4). Only unbounded surfaces have them: their parallel-light arc passes through the anti-lamp point.</p>"]},parArc:{zh:["平行光弧","<p>把灯换成同一仰角、无穷远的太阳时, 这条光路的经典晕弧. 离眼极近的晶体看灯的方向和眼睛一样, 所以发散光晕总有一边贴着它 (只在天空视图里画).</p>"],en:["Parallel-light arc","<p>The classic halo arc this path would give if the lamp were a sun at the same elevation, infinitely far away. Crystals right next to the eye see the lamp in the same direction as the eye, so the divergent halo always touches it on one side (drawn in the sky view only).</p>"]},ref22:{zh:["22° 参考圈","<p>以灯为心、半径 22° 的圆, 用来估角度.</p>"],en:["22° reference circle","<p>A circle of radius 22° around the lamp, for judging angles.</p>"]},mirror:{zh:["左右镜像补全","<p>关于灯–眼竖直面左右翻转再画一遍. 很多光路要和它的镜像光路 (如 3-1-5 与 3-1-7) 合起来才左右对称; 打开它就不必两条都输入.</p>"],en:["Left–right mirror fill-in","<p>Draws everything again mirrored in the vertical plane through the lamp and the eye. Many paths are only symmetric together with their mirror path (3-1-5 with 3-1-7, for example); with this on you do not need to enter both.</p>"]},surf2:{zh:["二自由度曲面",'<p>两个自由度时, 能把光送进眼睛的晶体位置填满一块体. 选一条平行光曲线做"曲面": 焦散 (最亮的缘) 或某条边界 (入射掠射 / 出射临界 / 反弹接缝 / 蓝边). 每个锥仰角 h 一层, 用光点法在取向平面上追这条曲线, 再映射到空间.</p><p>光路上没有选中的曲线时自动改用焦散.</p>'],en:["2-DOF surface",'<p>With two degrees of freedom the crystal positions that reach the eye fill a volume. Pick one parallel-light curve to draw as the "surface": the caustic (brightest rim) or a boundary (entry grazing / exit critical / bounce seam / blue edge). Each cone elevation h is one layer: the light-point method traces the curve on the orientation plane, then it is mapped into space.</p><p>If the path has no such curve, the caustic is used.</p>']},maxDist:{zh:["截断距离","<p>只画离灯这么远以内的晶体. 有的晕面 (Parry 3-5 等) 一直延伸到无穷远, 必须截断.</p>"],en:["Truncation distance","<p>Only crystals within this distance of the lamp are drawn. Some halo surfaces (Parry 3-5, for example) run off to infinity and have to be cut.</p>"]},cone:{zh:["锥切片","<p>灯处仰角为 h 的入射光锥 (光以仰角 −h 离开灯, 打到的晶体看灯的仰角正好是 h) 与晕面的交线: 光锥法里的一层. 一自由度时画锥上的晶体位置 (红点); 二自由度时是这一层的焦散 / 选定曲线 (红线). 天空视图里显示它们的视方向.</p>"],en:["Cone slice","<p>The incidence cone with elevation h at the lamp (light leaves the lamp downward at h, so the crystals it hits see the lamp at elevation h) cut with the halo surface: one layer of the light-cone method. One degree of freedom: the crystal positions on the cone (red dots); two degrees: that layer’s caustic / chosen curve (red lines). The sky view shows their directions.</p>"]},shell:{zh:["发散度球壳","<p>以眼为心、半径 r 的球面切晕面得到的晕线. 发散度 ρ = r/D (D = 眼到灯的距离), κ = lg ρ. ρ→0 是平行光晕, ρ→∞ 是反灯点剖面; 发散光照片大致是 ρ ≈ 1/4…4 这些层叠起来.</p><p>闭式: 一层壳上的晕线是晶体系太阳球上同一个二次型 Φ<sub>ρ</sub>(w) = 0, 被光路的边界剪成弧; 弧的末端 (白点) 是曲线与边界的交点, 折叠 (橙三角) 是两种落位重合处, 尖点 (品红星). κ 与 r 互相回填, 最后改的那个保持不变.</p>"],en:["Divergency shell","<p>The halo curve cut out of the surface by a sphere of radius r around the eye. Divergency ρ = r/D (D = eye-to-lamp distance), κ = lg ρ. ρ→0 is the parallel-light halo, ρ→∞ the anti-lamp profile; a photo of a lamp halo is roughly the layers ρ ≈ 1/4 … 4 stacked together.</p><p>Closed form: on one shell the curve is the zero set of one quadratic Φ<sub>ρ</sub>(w) = 0 on the crystal-frame sun sphere, cut into arcs by the path’s boundaries; arc ends (white dots) are where the curve meets a boundary, folds (orange triangles) are where the two placements coincide, cusps (magenta stars). κ and r fill each other in; the one you changed last stays fixed.</p>"]}};var os="zh";function Vh(i){return i==="zh"||i==="en"?i:String(navigator.languages&&navigator.languages[0]||navigator.language||"").toLowerCase().startsWith("zh")?"zh":"en"}function Gh(i){return os=i==="en"?"en":"zh",document.documentElement.lang=os==="zh"?"zh-CN":"en",os}var na=()=>os;function ft(i,t){let e=Hh[i],n=e===void 0?i:os==="en"?e[1]:e[0];return t&&(n=n.replace(/\{(\w+)\}/g,(s,r)=>t[r]!==void 0?t[r]:s)),n}function il(i){let t=nl[i];if(!t)return null;let e=os==="en"?t.en:t.zh;return{title:e[0],body:e[1]}}var Wh=()=>Object.keys(nl);function Xh(i=document){for(let t of i.querySelectorAll("[data-i18n]")){let e=ft(t.dataset.i18n);e.includes("<")?t.innerHTML=e:t.textContent=e}for(let[t,e]of[["data-i18n-title","title"],["data-i18n-aria","aria-label"],["data-i18n-ph","placeholder"]])for(let n of i.querySelectorAll(`[${t}]`))n.setAttribute(e,ft(n.getAttribute(t)))}var ia={3:0,4:Math.PI/3,5:2*Math.PI/3,6:Math.PI,7:4*Math.PI/3,8:5*Math.PI/3},ls=[3,4,5,6,7,8],K0=Math.sqrt(3)/2,sa=class{constructor(t,e){this.cv=t,this.onFace=e,this.yaw=-.62,this.pitch=.4,this.dist=[1,1,1,1,1,1],this.h=1,this.faces=[],this.pyr=!1,this.apexUp=56,this.apexLo=56,this.hit=[],this.hover=0;let n=null;t.addEventListener("pointerdown",r=>{n={x:r.clientX,y:r.clientY,sx:r.clientX,sy:r.clientY,moved:!1},t.setPointerCapture(r.pointerId)}),t.addEventListener("pointermove",r=>{if(n){Math.hypot(r.clientX-n.sx,r.clientY-n.sy)>4&&(n.moved=!0),n.moved&&(t
